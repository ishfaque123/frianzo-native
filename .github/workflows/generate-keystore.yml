name: Generate Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Generate keystore
        run: |
          keytool -genkeypair -keystore frianzo.jks -alias frianzo -keyalg RSA -keysize 2048 -validity 9125 -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" -keypass "${{ secrets.ANDROID_KEY_PASSWORD }}" -dname "CN=Frianzo, O=Frianzo, C=PK"
      - name: Show SHA-1 fingerprint
        run: |
          keytool -list -v -keystore frianzo.jks -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" | grep SHA1
      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: frianzo-keystore
          path: frianzo.jks
          retention-days: 1
