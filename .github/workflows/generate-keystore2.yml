name: generate-keystore2

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          keytool -genkeypair -alias frianzo -keyalg RSA -keysize 2048 -validity 9125 -keystore frianzo.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" -keypass "$ANDROID_KEY_PASSWORD" -dname "CN=Frianzo, O=Frianzo, C=PK"
          keytool -list -v -keystore frianzo.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" | grep SHA1
      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: frianzo-keystore
          path: frianzo.jks
