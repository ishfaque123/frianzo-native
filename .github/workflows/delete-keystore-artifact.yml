name: Delete Keystore Artifact
on:
  workflow_dispatch:
permissions:
  actions: write
jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete frianzo-keystore artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X DELETE repos/${{ github.repository }}/actions/artifacts/13140309265
          echo "Remaining artifacts for run 41443897637:"
          gh api repos/${{ github.repository }}/actions/runs/41443897637/artifacts --jq '.artifacts | length'
